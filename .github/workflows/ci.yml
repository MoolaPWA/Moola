name: CI/CD Pipeline

on:
  push:
    branches: [ main, docker-https ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (поиск секретов)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Lint frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run lint --if-present

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (локально для сканирования)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend:test

      - name: Build frontend image (локально для сканирования)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: frontend:test

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:test
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:test
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print status
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ CI/CD pipeline успешно завершён"
          else
            echo "❌ CI/CD pipeline завершился с ошибкой"
            exit 1
          fi