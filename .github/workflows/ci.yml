name: CI/CD Pipeline

on:
  push:
    branches: [ main, docker-https ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: moolapwa/moola-backend
  IMAGE_NAME_FRONTEND: moolapwa/moola-frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (поиск секретов)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Lint frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run lint --if-present || true
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: db_Moola
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt pytest httpx

      - name: Init database
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -h localhost -U admin -d db_Moola -f backend/database/init/init.sql

      - name: Run backend
        env:
          DB_USER: admin
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: db_Moola
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          cd backend
          pip install -r requirements.txt
          python -m uvicorn main:main_app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (локально для сканирования)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend:test

      - name: Build frontend image (локально для сканирования)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: frontend:test

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:test
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:test
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print status
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ CI/CD pipeline успешно завершён"
          else
            echo "❌ CI/CD pipeline завершился с ошибкой"
            exit 1
          fi